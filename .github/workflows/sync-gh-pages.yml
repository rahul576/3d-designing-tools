name: Sync gh-pages

# The site is published from the gh-pages branch.
# Every push to main resets gh-pages to main so the site always shows the latest changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset gh-pages to main
        run: git push --force origin HEAD:refs/heads/gh-pages
