<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Designing Tools</title>
<meta name="description" content="Free browser-based tools that make 3D design and 3D printing easier.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#fff;--soft:#f3f4f7;--line:#e3e6ec;--text:#1d2330;--muted:#5b6475;--faint:#9aa1ae;--btn:#1d2330;--btn-ink:#fff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1117;--panel:#161922;--soft:#1e222d;--line:#2a2f3c;--text:#e9ecf3;--muted:#9aa2b6;--faint:#6b7386;--btn:#e9ecf3;--btn-ink:#11141b}
}
:root[data-theme="dark"]{--bg:#0f1117;--panel:#161922;--soft:#1e222d;--line:#2a2f3c;--text:#e9ecf3;--muted:#9aa2b6;--faint:#6b7386;--btn:#e9ecf3;--btn-ink:#11141b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:700;font-size:17px}
header nav{margin-left:auto;display:flex;align-items:center;gap:8px}
header nav a{color:var(--muted);font-size:14px;padding:6px 8px}
header nav a:hover{color:var(--text)}
.theme{border:1px solid var(--line);background:var(--panel);color:var(--muted);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.theme svg{width:16px;height:16px}
.intro{margin:40px 0 28px}
h1{font-size:28px;letter-spacing:-.02em;margin:0}
.intro p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:20px}
.card:target{outline:2px solid var(--text);outline-offset:2px}
.thumb{display:block;aspect-ratio:16/10;background:var(--soft);border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.thumb:hover img{transform:scale(1.02)}
.body{padding:16px;flex:1;display:flex;flex-direction:column}
.card h2{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.ver{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 7px}
.card p{font-size:14px;color:var(--muted);margin:6px 0 4px;line-height:1.45}
.fmt{font-size:12px;color:var(--faint);margin-bottom:14px}
.spacer{flex:1}
.open{display:block;text-align:center;background:var(--btn);color:var(--btn-ink);border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600}
.open:hover{opacity:.9}
.extra{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.extra a:hover{color:var(--text);text-decoration:underline}
.extra select{font:inherit;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.soon{border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--faint);font-size:14px;min-height:200px}
footer{border-top:1px solid var(--line);margin-top:56px;padding:20px 0;font-size:13px;color:var(--faint)}
footer a:hover{color:var(--text)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="./">3D Designing Tools</a>
  <nav>
    <a href="https://github.com/rahul576/3d-designing-tools">GitHub</a>
    <button class="theme" id="themeBtn" type="button" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
  </nav>
</div></header>

<main class="wrap">
  <div class="intro">
    <h1>Tools</h1>
    <p>Free, offline, runs in your browser. Nothing is uploaded.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">© <span id="yr">2026</span> 3D Designing Tools · <a href="https://github.com/rahul576/3d-designing-tools">github.com/rahul576/3d-designing-tools</a></div></footer>

<script>
/*
  TOOLS: one entry per tool folder. To add a new tool, put it in its own
  folder at the repo root (with an index.html) and add an entry here.
  A card is created for it automatically.
  Versions: the folder's index.html is always the latest version, and every
  version is also kept at <folder>/versions/vN/index.html. List them in
  "versions", newest first, and the card gets a version picker.
  thumb: a screenshot of the tool, shown at 16:10 on the card.
*/
const TOOLS = [
  {
    id: "tray-generator",
    name: "Tray Generator",
    folder: "tray-generator/",
    version: "v8",
    versions: ["v8", "v7", "v6", "v5", "v4", "v3", "v2"],
    tagline: "Stackable trays and boxes for 3D printing, with lids, compartments and wall patterns.",
    formats: "STL · 3MF",
    thumb: "tray-generator/thumb.png",
    guide: "tray-generator/README.txt"
  },
  {
    id: "photo-frame-generator",
    name: "Photo Frame Generator",
    folder: "photo-frame-generator/",
    version: "v6",
    versions: ["v6", "v5", "v4", "v3", "v2", "v1"],
    tagline: "3D printable photo and collage frames in up to four colours, previewed at true size on a wall, with few filament changes.",
    formats: "3MF · STL · PNG",
    thumb: "photo-frame-generator/thumb.png",
    guide: "photo-frame-generator/README.md"
  },
  {
    id: "3mf-viewer",
    name: "3MF Viewer",
    folder: "3mf-viewer/",
    version: "v1",
    versions: ["v1"],
    tagline: "See 3MF print files in 3D in their filament colours. Also a Mac app with Finder thumbnails, via Homebrew.",
    formats: "3MF · STL · Mac app",
    thumb: "3mf-viewer/thumb.png",
    guide: "https://github.com/rahul576/3d-designing-tools/tree/main/3mf-viewer#readme"
  }
  // Next tool goes here, e.g. { id: "my-tool", name: "My Tool", folder: "my-tool/", ... }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function versionPicker(t) {
  if (!t.versions || t.versions.length < 2) return "<span></span>";
  const opts = [`<option value="${esc(t.folder)}">Latest (${esc(t.versions[0])})</option>`,
    ...t.versions.slice(1).map(v => `<option value="${esc(t.folder + "versions/" + v + "/")}">${esc(v)}</option>`)];
  return `<select data-ver aria-label="${esc(t.name)} version">${opts.join("")}</select>`;
}

const grid = document.getElementById("grid");
grid.innerHTML = TOOLS.map(t => `
  <article class="card" id="${esc(t.id)}">
    <a class="thumb" data-open href="${esc(t.folder)}"><img src="${esc(t.thumb)}" alt="${esc(t.name)} screenshot" loading="lazy"></a>
    <div class="body">
      <h2>${esc(t.name)}${t.version ? ` <span class="ver">${esc(t.version)}</span>` : ""}</h2>
      <p>${esc(t.tagline)}</p>
      ${t.formats ? `<div class="fmt">${esc(t.formats)}</div>` : ""}
      <div class="spacer"></div>
      <a class="open" data-open href="${esc(t.folder)}">Open tool</a>
      <div class="extra">${versionPicker(t)}${t.guide ? `<a href="${esc(t.guide)}">Guide</a>` : ""}</div>
    </div>
  </article>`).join("") + `<div class="soon">More tools coming</div>`;

grid.addEventListener("change", e => {
  const sel = e.target.closest("[data-ver]"); if (!sel) return;
  sel.closest(".card").querySelectorAll("[data-open]").forEach(a => a.href = sel.value);
});

document.getElementById("yr").textContent = new Date().getFullYear();

/* Old links like #tray-generator still land on the tool's card */
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }

/* Theme toggle */
const themeBtn = document.getElementById("themeBtn");
try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
});
</script>
</body>
</html>
